name: Optimize resource pack v2
on: [push]

permissions:
  contents: write

jobs:
  packsquash:
    name: Optimize resource pack
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run PackSquash
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: latest
          options: |
            pack_directory = '.'
            output_file_path = '/tmp/pack.zip'
            exclude = ['.github', '.gitignore', 'README.md', '.git', '.vscode']

            recompress_compressed_files = true
            zip_compression_iterations = 35
            zip_spec_conformance_level = 'disregard'
            skip_pack_icon = false

            ["**/*.png"]
            image_data_compression_iterations = 20
            maximum_width_and_height = 21600

            ["**/*.nbt"]
            nbt_compression_iterations = 25

      - name: Tag and create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: action-v${{ github.run_number }}
          files: /tmp/pack.zip
